# Logik-tests → build → IPA. dev = test + build, main = release + SideStore-kilde.
name: Build IPA

on:
  push:
    branches: [main, dev]
    paths: ["ios/**", "scripts/**", ".github/workflows/ipa.yml"]
  workflow_dispatch:

permissions:
  contents: write

# Et nyt push afbryder en igangværende kørsel på samme branch
concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      # Kun indbyggede værktøjer (repoets politik tillader ikke actions fra andre end Thyxo)
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git"
          git fetch -q --depth 20 origin "${{ github.ref_name }}"
          git checkout -q -B "${{ github.ref_name }}" FETCH_HEAD
          git log --oneline -1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      # Hurtige logik-tests (selvtesten og UI-testene køres ikke i CI – de tog ~12 min; kør selvtesten lokalt
      # med swift test eller i appens menu)
      - name: Logic tests
        working-directory: ios
        run: |
          rc=0
          xcodebuild test -project KameraPlus.xcodeproj -scheme KameraPlusLogicTests -destination 'platform=macOS' \
            -skip-testing:KameraPlusLogicTests/SelfTestTests > test.log 2>&1 || rc=$?
          grep -E "error:|failed|TEST SUCCEEDED|TEST FAILED" test.log | tail -n 60 || true
          [ $rc -eq 0 ] || tail -n 60 test.log
          exit $rc

      - name: Build (unsigned)
        working-directory: ios
        run: |
          rc=0
          xcodebuild -project KameraPlus.xcodeproj -scheme KameraPlus \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION=1.0.${{ github.run_number }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || rc=$?
          grep -E "error:|warning: .*/KameraPlus/|BUILD" build.log | sort -u | tail -n 120 || true
          [ $rc -eq 0 ] || tail -n 60 build.log
          exit $rc

      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/KameraPlus.app Payload/
          plutil -p Payload/KameraPlus.app/Info.plist | grep -E "CFBundleDisplayName|CFBundleIdentifier|NSCamera" 
          zip -qry KameraPlus.ipa Payload
          ls -lh KameraPlus.ipa

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" ios/KameraPlus.ipa \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "KameraPlus 1.0.${{ github.run_number }}" \
            --notes "Usigneret IPA. Installér via SideStore-kilden, AltStore eller Sideloadly (gratis Apple ID)." \
            --latest

      # Andre branches (fx manuelt startet): IPA som test-pre-release, SideStore-kilden røres ikke
      - name: Publish test build
        if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "test-${{ github.run_number }}" ios/KameraPlus.ipa \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Test 1.0.${{ github.run_number }} (${{ github.ref_name }})" \
            --notes "Usigneret test-IPA fra ${{ github.ref_name }}. Ikke i SideStore-kilden – installér filen direkte (SideStore/AltStore/Sideloadly)." \
            --prerelease

      - name: Update SideStore source
        if: github.ref == 'refs/heads/main'
        run: |
          python3 scripts/make_source.py "1.0.${{ github.run_number }}" "${{ github.run_number }}" ios/KameraPlus.ipa \
            "https://github.com/${{ github.repository }}/releases/download/build-${{ github.run_number }}/KameraPlus.ipa"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sidestore/source.json
          git commit -m "SideStore-kilde: 1.0.${{ github.run_number }}"
          git pull --rebase origin main
          git push origin HEAD:main
