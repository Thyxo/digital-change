name: KameraPlus
options:
  bundleIdPrefix: dk.thyxo
  deploymentTarget:
    iOS: "17.0"
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  KameraPlus:
    type: application
    platform: iOS
    sources:
      - path: KameraPlus
      # De ægte Rider Back-kort (scripts/prepare-cards.py) som mappe i app-bundtet: Cards/rider-*.png/.rgb/.json
      - path: Cards
        type: folder
    info:
      path: KameraPlus/Info.plist
      properties:
        CFBundleDisplayName: Kamera
        CFBundleDevelopmentRegion: da
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBlack
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Kameraet bruges til at tage billeder."
        NSPhotoLibraryAddUsageDescription: "Billeder kan gemmes i Fotos."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.thyxo.kameraplus
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO

  # Logik-tests (farve, maske, overgange, tilstand, ryst, selvtest) – kører på Mac uden iPhone
  KameraPlusLogicTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - KameraPlusTests
      - path: KameraPlus/Logic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.thyxo.kameraplus.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        SWIFT_OPTIMIZATION_LEVEL: "-O"

  # UI-tests på iPhone-simulator (hemmelig menu og panik)
  KameraPlusUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [KameraPlusUITests]
    dependencies:
      - target: KameraPlus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.thyxo.kameraplus.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: KameraPlus

schemes:
  KameraPlusLogicTests:
    build:
      targets:
        KameraPlusLogicTests: [test]
    test:
      targets: [KameraPlusLogicTests]
  KameraPlus:
    build:
      targets:
        KameraPlus: all
        KameraPlusUITests: [test]
    test:
      targets: [KameraPlusUITests]
